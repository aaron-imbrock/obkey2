[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obkey2"
version = "0.0.14"
description = "Openbox Key Editor"
authors = [{name = "Aaron Imbrock", email = "contact@sizza.net"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyGObject",
]

[project.scripts]
obkey = "obkey2.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obkey2"]
